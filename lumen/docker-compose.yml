# Ellementry Analytics — PostgreSQL + app in containers.
#   1. copy .env.docker.example to .env and set POSTGRES_PASSWORD (+ optional LLM / LUMEN_SECRET_KEY)
#   2. docker compose up -d --build        ->  http://localhost:8000
# Ports are bound to 127.0.0.1 only: the app has no password login and is meant for local use.
name: lumen

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.docker.example)}
      POSTGRES_DB: lumen_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # for psql / BI tools on this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen_analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  app:
    build: .
    image: lumen-analytics:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Passes LUMEN_CONN_<NAME> passwords for external database connectors (see .env.docker.example).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://lumen:${POSTGRES_PASSWORD}@db:5432/lumen_analytics
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LUMEN_SECRET_KEY: ${LUMEN_SECRET_KEY:-}
      DEFAULT_USER: ${DEFAULT_USER:-owner@local}
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    # Hardening: immutable root filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 256

volumes:
  pgdata:
  uploads:
