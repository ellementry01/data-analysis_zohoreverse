- id: im-gmv
  dashboard: instamart
  question: What is Instamart's sell-out value?
  expect: {widget: Sell-out value (GMV)}
- id: im-invoiced
  dashboard: instamart
  question: How much did we invoice to Instamart?
  expect: {widget: "Invoiced to Instamart (net, excl. GST)"}
- id: im-sent
  dashboard: instamart
  question: How many units did we send to Instamart?
  expect: {widget: Units sent to Instamart}
- id: im-stock
  dashboard: instamart
  question: How much of our stock is with Instamart?
  expect: {widget: Stock with Instamart (since Apr 2025)}
- id: im-top-product
  dashboard: instamart
  question: What is the top-selling product on Instamart?
  expect: {widget: Top 15 products sold on Instamart, top: true, column: qc_units_sold}
- id: im-top-city
  dashboard: instamart
  question: Which city buys the most on Instamart?
  expect: {widget: Instamart sales by city, top: true}
- id: im-revenue
  dashboard: instamart
  question: Is Instamart's sell-out our revenue?
  must_mention: [[not revenue, not our revenue, isn't revenue, is not revenue, demand, invoic, isn't our revenue]]

# ---------------------------------------------------------------- Data health
- id: dh-errors
  dashboard: data-health
  question: Are there any blocking data errors?
  expect: {widget: Blocking data errors}
- id: dh-warnings
  dashboard: data-health
  question: How many checks are flagging rows?
  expect: {widget: Checks flagging rows (warnings)}
- id: dh-gaps
  dashboard: data-health
  question: How many data gaps are still open?
  expect: {widget: Open data gaps}
- id: dh-files
  dashboard: data-health
  question: How many source files have been loaded?
  expect: {widget: Source files loaded}
- id: dh-top-check
  dashboard: data-health
  question: Which quality check flags the most rows?
  expect: {widget: Quality checks that flag rows (latest build), top: true, label: check_name}
- id: dh-top-source
  dashboard: data-health
  question: Which source has the most files loaded?
  expect: {widget: "Files loaded, by source", top: true, column: files_loaded}
- id: dh-gap-owner
  dashboard: data-health
  question: Who owns the most open data gaps?
  expect: {spec: {dimensions: [{field: data_gaps.owner}], measures: [{metric: open_data_gaps, alias: g}], filters: [{field: data_gaps.status, op: neq, value: CLOSED}], sort: [{field: g, dir: desc}], limit: 1}, top: true}
- id: dh-blocking-meaning
  dashboard: data-health
  question: What is a blocking data error?
  must_mention: [[stop, block, fail, error]]
